<html class="light" lang="en">
<head>

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
            background-color: #f5fbf9; /* surface */
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .loading-spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border-left-color: var(--tw-colors-primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="text-on-background min-h-screen flex flex-col antialiased">

    <!-- Top Header -->
    <header class="w-full bg-surface-container-lowest border-b border-outline-variant py-4 px-margin-mobile flex flex-col gap-4 sticky top-0 z-10 shadow-sm">
        <div class="flex items-center gap-2 justify-center">
            <span class="material-symbols-outlined text-primary text-[28px]">event_available</span>
            <h1 class="font-headline-md text-primary">Assistant Schedule</h1>
        </div>
        
        <!-- Filter/Search -->
        <div class="relative max-w-md mx-auto w-full flex flex-col gap-3">
            <div class="relative w-full">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-on-surface-variant text-[20px]">search</span>
                </div>
                <input type="text" id="assistant_search" placeholder="Type your name to filter..." class="block w-full bg-surface-container-low border border-outline-variant rounded-full py-2 pl-10 pr-4 text-on-surface focus:outline-none focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary-fixed-dim transition-colors">
            </div>
            <div class="relative w-full">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-on-surface-variant text-[20px]">filter_list</span>
                </div>
                <select id="assistant_dropdown" class="block w-full bg-surface-container-low border border-outline-variant rounded-full py-2 pl-10 pr-10 text-on-surface focus:outline-none focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary-fixed-dim transition-colors appearance-none">
                    <option value="">Or select your name from the list...</option>
                </select>
                <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-on-surface-variant text-[20px]">expand_more</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="flex-grow px-margin-mobile pt-stack-md pb-stack-lg max-w-2xl mx-auto w-full">
        
        <!-- Status Indicator -->
        <div id="connection_status" class="flex items-center justify-center gap-2 mb-4 text-xs font-label-md text-on-surface-variant">
            <div class="w-2 h-2 rounded-full bg-outline-variant" id="status_dot"></div>
            <span id="status_text">Connecting to schedule...</span>
        </div>

        <!-- Date Selector Pills -->
        <div id="date_selector_container" class="flex items-center gap-2 overflow-x-auto pb-2 mb-4 scrollbar-none">
        </div>

        <div id="schedule_loading" class="flex justify-center py-12">
            <div class="loading-spinner"></div>
        </div>

        <!-- Schedule List -->
        <div id="schedule_list" class="flex flex-col gap-stack-md">
            <!-- Populated from Supabase -->
        </div>

    </main>

    <!-- Application Script -->
    <script>
        // --- Supabase Initialization ---
        const SUPABASE_URL = 'https://guscxutiucotybrzrlgr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1c2N4dXRpdWNvdHlicnpybGdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkyNTc1NjUsImV4cCI6MjA4NDgzMzU2NX0.6NeQYrtjOy-V2TfLjJJPfH0HE0BuHS7gejBkq1Mlllo';
        
        let supabaseClient;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch(e) {
            console.error("Failed to initialize Supabase client:", e);
        }

        let allSchedules = [];
        let selectedDateFilter = 'auto'; // 'auto' (active day), 'all', or specific 'YYYY-MM-DD'
        let currentActiveDay = null;
        const LECTURE_DURATION_MS = 2 * 60 * 60 * 1000; // 2 hours duration per lecture

        async function fetchSchedule() {
            try {
                updateStatus('fetching');
                const { data, error } = await supabaseClient
                    .from('schedule')
                    .select('*')
                    .order('date', { ascending: true })
                    .order('time', { ascending: true });

                if (error) throw error;
                
                allSchedules = data || [];
                populateDropdown();
                document.getElementById('schedule_loading').classList.add('hidden');
                renderScheduleList();
                updateStatus('connected');
            } catch (err) {
                console.error("Error fetching schedule:", err);
                updateStatus('error');
            }
        }

        function updateStatus(state) {
            const dot = document.getElementById('status_dot');
            const text = document.getElementById('status_text');
            
            if(state === 'fetching') {
                dot.className = "w-2 h-2 rounded-full bg-secondary-fixed-dim animate-pulse";
                text.textContent = "Syncing schedule...";
            } else if(state === 'connected') {
                dot.className = "w-2 h-2 rounded-full bg-secondary";
                text.textContent = "Live Updates Active";
            } else if (state === 'error') {
                dot.className = "w-2 h-2 rounded-full bg-error";
                text.textContent = "Connection Error. Retrying...";
            }
        }

        function parseSessionDateTime(dateStr, timeStr) {
            if (!dateStr) return null;
            const [y, m, d] = dateStr.split('-').map(Number);
            const [h, min, s] = (timeStr || '00:00:00').split(':').map(Number);
            return new Date(y, m - 1, d, h || 0, min || 0, s || 0);
        }

        function getSessionStatus(dateStr, timeStr) {
            const start = parseSessionDateTime(dateStr, timeStr);
            if (!start) return { status: 'upcoming', diffMs: 0 };
            const now = new Date();
            const end = new Date(start.getTime() + LECTURE_DURATION_MS);
            
            if (now >= end) {
                return { status: 'completed', start, end };
            } else if (now >= start && now < end) {
                const elapsedMs = now - start;
                return { status: 'in_progress', start, end, elapsedMs };
            } else {
                const diffMs = start - now;
                return { status: 'upcoming', start, end, diffMs };
            }
        }

        function computeActiveDay(schedules) {
            if (!schedules || schedules.length === 0) return null;

            // Group by date
            const grouped = {};
            schedules.forEach(s => {
                if (!grouped[s.date]) grouped[s.date] = [];
                grouped[s.date].push(s);
            });

            const sortedDates = Object.keys(grouped).sort();
            const now = new Date();

            for (const date of sortedDates) {
                const sessions = grouped[date];
                // Find the latest end time among sessions on this date
                let maxEndTime = 0;
                sessions.forEach(s => {
                    const start = parseSessionDateTime(s.date, s.time);
                    if (start) {
                        const end = start.getTime() + LECTURE_DURATION_MS;
                        if (end > maxEndTime) maxEndTime = end;
                    }
                });

                // If the last session has not ended yet, this date is active!
                if (now.getTime() < maxEndTime) {
                    return date;
                }
            }

            // If all scheduled dates are done, default to the last available date
            return sortedDates[sortedDates.length - 1];
        }

        function updateCountdowns() {
            const newActive = computeActiveDay(allSchedules);
            if (newActive && newActive !== currentActiveDay && selectedDateFilter === 'auto') {
                currentActiveDay = newActive;
                renderScheduleList();
                return;
            }

            document.querySelectorAll('.countdown-timer').forEach(el => {
                const dateStr = el.getAttribute('data-date');
                const timeStr = el.getAttribute('data-time');
                if (!dateStr || !timeStr) return;
                
                const sessionInfo = getSessionStatus(dateStr, timeStr);
                
                if (sessionInfo.status === 'completed') {
                    el.innerHTML = `<span class="inline-flex items-center gap-1 text-on-surface-variant font-medium text-xs"><span class="material-symbols-outlined text-[14px] text-outline">check_circle</span> Session Finished</span>`;
                } else if (sessionInfo.status === 'in_progress') {
                    const mins = Math.floor(sessionInfo.elapsedMs / 60000);
                    el.innerHTML = `<span class="inline-flex items-center gap-1 text-secondary font-semibold text-xs animate-pulse"><span class="material-symbols-outlined text-[14px]">play_circle</span> Ongoing (${mins}m ago)</span>`;
                } else {
                    const diffSec = Math.floor(sessionInfo.diffMs / 1000);
                    const hStr = Math.floor(diffSec / 3600);
                    const mStr = Math.floor((diffSec % 3600) / 60);
                    const sStr = diffSec % 60;
                    let text = "Starts in: ";
                    if (hStr > 0) text += `${hStr}h `;
                    if (mStr > 0 || hStr > 0) text += `${mStr}m `;
                    text += `${sStr}s`;
                    el.innerHTML = `<span class="text-secondary font-medium flex items-center gap-1 text-xs"><span class="material-symbols-outlined text-[14px]">hourglass_empty</span>${text}</span>`;
                }
            });
        }

        function formatTime(timeStr) {
            if (!timeStr) return '';
            const [h, m] = timeStr.split(':');
            let hour = parseInt(h, 10);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            hour = hour % 12 || 12;
            return `${hour}:${m} ${ampm}`;
        }

        function setDateFilter(dateVal) {
            selectedDateFilter = dateVal;
            renderScheduleList();
        }

        function renderDatePills(allDates, activeDate) {
            const container = document.getElementById('date_selector_container');
            if (!container) return;

            if (allDates.length <= 1) {
                container.innerHTML = '';
                return;
            }

            const todayStr = new Date().toISOString().split('T')[0];

            let pillsHTML = `
                <button type="button" onclick="setDateFilter('auto')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all duration-150 flex items-center gap-1.5 ${selectedDateFilter === 'auto' ? 'bg-primary-container text-on-primary shadow-sm' : 'bg-surface-container border border-outline-variant text-on-surface hover:bg-surface-container-high'}">
                    <span class="material-symbols-outlined text-[14px]">auto_awesome</span>
                    <span>Current Day</span>
                </button>
            `;

            allDates.forEach(date => {
                const dateObj = new Date(date);
                const dayLabel = dateObj.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
                const isSelected = selectedDateFilter === date || (selectedDateFilter === 'auto' && date === activeDate);
                const isToday = date === todayStr;
                const isCurrentActive = date === activeDate;

                pillsHTML += `
                    <button type="button" onclick="setDateFilter('${date}')" class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all duration-150 flex items-center gap-1 ${isSelected && selectedDateFilter !== 'auto' ? 'bg-secondary text-on-secondary shadow-sm' : 'bg-surface-container border border-outline-variant text-on-surface hover:bg-surface-container-high'}">
                        ${isCurrentActive ? '<span class="w-1.5 h-1.5 rounded-full bg-secondary-fixed-dim"></span>' : ''}
                        <span>${isToday ? 'Today, ' : ''}${dayLabel}</span>
                    </button>
                `;
            });

            pillsHTML += `
                <button type="button" onclick="setDateFilter('all')" class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all duration-150 ${selectedDateFilter === 'all' ? 'bg-secondary text-on-secondary shadow-sm' : 'bg-surface-container border border-outline-variant text-on-surface hover:bg-surface-container-high'}">
                    All Dates
                </button>
            `;

            container.innerHTML = pillsHTML;
        }

        function renderScheduleList() {
            const listContainer = document.getElementById('schedule_list');
            const searchVal = document.getElementById('assistant_search').value.toLowerCase().trim();
            const dropdownVal = document.getElementById('assistant_dropdown').value.toLowerCase();
            const activeFilter = searchVal || dropdownVal;

            currentActiveDay = computeActiveDay(allSchedules);

            // Group all schedules by date
            const groupedAll = {};
            allSchedules.forEach(s => {
                if(!groupedAll[s.date]) groupedAll[s.date] = [];
                groupedAll[s.date].push(s);
            });
            const allDates = Object.keys(groupedAll).sort();

            renderDatePills(allDates, currentActiveDay);

            // Determine target dates to display
            let targetDates = [];
            if (selectedDateFilter === 'all') {
                targetDates = allDates;
            } else if (selectedDateFilter === 'auto') {
                targetDates = currentActiveDay ? [currentActiveDay] : allDates;
            } else {
                targetDates = [selectedDateFilter];
            }

            // Filter schedules
            let filtered = allSchedules.filter(s => targetDates.includes(s.date));
            if (activeFilter) {
                filtered = filtered.filter(s => {
                    return (s.assistants || []).some(a => a.toLowerCase().includes(activeFilter));
                });
            }

            filtered.sort((a, b) => {
                const dateA = a.date || '';
                const dateB = b.date || '';
                if (dateA !== dateB) return dateA.localeCompare(dateB);
                const timeA = a.time || '';
                const timeB = b.time || '';
                return timeA.localeCompare(timeB);
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                <div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-8 text-center mt-4">
                    <span class="material-symbols-outlined text-[48px] text-outline-variant mb-2">event_busy</span>
                    <p class="text-on-surface font-body-lg">No assignments found.</p>
                    ${searchVal ? `<p class="text-on-surface-variant font-body-md mt-1">Try a different name or select 'All Dates'.</p>` : ''}
                </div>`;
                return;
            }

            // Group filtered for display
            const grouped = {};
            filtered.forEach(s => {
                if(!grouped[s.date]) grouped[s.date] = [];
                grouped[s.date].push(s);
            });

            const html = [];
            Object.keys(grouped).sort().forEach(date => {
                const isToday = (date === new Date().toISOString().split('T')[0]);
                const isActive = (date === currentActiveDay);
                const dateObj = new Date(date);
                const dateFormatted = dateObj.toLocaleDateString(undefined, {weekday: 'long', month:'long', day:'numeric'});
                
                const dateBadge = isActive 
                    ? `<span class="bg-primary-container text-on-primary text-[10px] font-bold px-2 py-0.5 rounded-full tracking-normal">ACTIVE SCHEDULE</span>`
                    : '';

                html.push(`
                    <div class="mt-4 mb-2 flex items-center justify-between sticky top-[104px] z-0 bg-background/90 backdrop-blur-sm py-1.5">
                        <div class="flex items-center gap-2">
                            <h2 class="font-label-md text-on-surface uppercase tracking-wider font-bold">${isToday ? 'Today: ' : ''}${dateFormatted}</h2>
                            ${dateBadge}
                        </div>
                    </div>
                `);
                
                grouped[date].forEach(item => {
                    const assistantsTags = (item.assistants || []).map(a => {
                        const isMatch = searchVal && a.toLowerCase().includes(searchVal);
                        const tagClass = isMatch 
                            ? "inline-flex items-center gap-1 bg-secondary-container text-on-secondary-container px-3 py-1.5 rounded-lg text-sm font-semibold border border-secondary"
                            : "inline-flex items-center gap-1 bg-surface-variant text-on-surface px-3 py-1.5 rounded-lg text-sm border border-outline-variant/50";
                        return `<span class="${tagClass}">${a}</span>`;
                    }).join('');

                    const statusInfo = getSessionStatus(date, item.time);
                    let badgeHtml = '';
                    if (statusInfo.status === 'completed') {
                        badgeHtml = `<span class="inline-flex items-center gap-1 bg-surface-variant text-on-surface-variant px-2.5 py-0.5 rounded-full text-[11px] font-semibold"><span class="material-symbols-outlined text-[13px]">check_circle</span> Completed</span>`;
                    } else if (statusInfo.status === 'in_progress') {
                        badgeHtml = `<span class="inline-flex items-center gap-1 bg-secondary-container text-on-secondary-container px-2.5 py-0.5 rounded-full text-[11px] font-bold animate-pulse"><span class="material-symbols-outlined text-[13px]">play_circle</span> In Progress</span>`;
                    }

                    const timeDisplay = item.time 
                        ? `<div class="font-label-md text-on-surface-variant flex items-center gap-2 mt-1">
                             <span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">schedule</span> ${formatTime(item.time)}</span>
                             ${badgeHtml}
                           </div>
                           <div class="countdown-timer font-label-sm mt-1" data-date="${date}" data-time="${item.time}"></div>` 
                        : '';

                    let locationButton = '';
                    if (item.address && item.address.trim() !== '') {
                        const rawAddress = item.address.trim();
                        const mapsUrl = (rawAddress.startsWith('http://') || rawAddress.startsWith('https://'))
                            ? rawAddress
                            : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(rawAddress)}`;

                        locationButton = `
                            <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-xl bg-primary-container text-on-primary hover:bg-secondary active:scale-95 transition-all duration-150 font-label-md shadow-sm self-start sm:self-center shrink-0">
                                <span class="material-symbols-outlined text-[18px]">location_on</span>
                                <span>Center Location</span>
                                <span class="material-symbols-outlined text-[14px]">open_in_new</span>
                            </a>
                        `;
                    }

                    const cardOpacity = statusInfo.status === 'completed' ? 'opacity-75 bg-surface-container-low' : 'bg-surface-container-lowest';

                    html.push(`
                    <article class="${cardOpacity} rounded-xl border border-outline-variant p-5 shadow-sm relative transition-all duration-300">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-3 pb-3 border-b border-surface-variant/50">
                            <div class="flex items-start gap-3">
                                <span class="material-symbols-outlined text-secondary-fixed-dim bg-secondary/10 p-2.5 rounded-xl shrink-0 mt-0.5">storefront</span>
                                <div>
                                    <h3 class="font-headline-md text-on-surface font-semibold">${item.center}</h3>
                                    ${timeDisplay}
                                </div>
                            </div>
                            ${locationButton}
                        </div>
                        <div class="mt-2">
                            <p class="font-label-md text-outline mb-2">ASSIGNED ASSISTANTS</p>
                            <div class="flex flex-wrap gap-2">${assistantsTags}</div>
                        </div>
                    </article>
                    `);
                });
            });

            listContainer.innerHTML = html.join('');
            updateCountdowns();
        }

        function populateDropdown() {
            const dropdown = document.getElementById('assistant_dropdown');
            const currentVal = dropdown.value;
            
            const uniqueAssistants = new Set();
            allSchedules.forEach(s => {
                if (s.assistants) {
                    s.assistants.forEach(a => uniqueAssistants.add(a));
                }
            });
            
            const sorted = Array.from(uniqueAssistants).sort();
            
            let optionsHTML = '<option value="">Or select your name from the list...</option>';
            sorted.forEach(a => {
                optionsHTML += `<option value="${a}">${a}</option>`;
            });
            
            dropdown.innerHTML = optionsHTML;
            if (sorted.includes(currentVal)) {
                dropdown.value = currentVal;
            }
        }

        // Search Input Listeners
        document.getElementById('assistant_search').addEventListener('input', () => {
            document.getElementById('assistant_dropdown').value = '';
            renderScheduleList();
        });
        
        document.getElementById('assistant_dropdown').addEventListener('change', () => {
            document.getElementById('assistant_search').value = '';
            renderScheduleList();
        });

        // Realtime Subscription
        if (supabaseClient) {
            supabaseClient
                .channel('public:schedule')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'schedule' }, payload => {
                    console.log("Realtime update received:", payload);
                    if (payload.eventType === 'INSERT') {
                        allSchedules.push(payload.new);
                    } else if (payload.eventType === 'DELETE') {
                        allSchedules = allSchedules.filter(s => s.id !== payload.old.id);
                    } else if (payload.eventType === 'UPDATE') {
                        const index = allSchedules.findIndex(s => s.id === payload.new.id);
                        if (index !== -1) allSchedules[index] = payload.new;
                    }
                    populateDropdown();
                    renderScheduleList();
                })
                .subscribe((status) => {
                    if(status === 'SUBSCRIBED') {
                        updateStatus('connected');
                    }
                });
        }

        // --- Init ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchSchedule();
            setInterval(updateCountdowns, 1000);
        });

    </script>
</body>
</html>
