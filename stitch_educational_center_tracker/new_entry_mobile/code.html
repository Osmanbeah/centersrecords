<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>New Entry - Center Tracker</title>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#1b4332",
                        "on-surface-variant": "#414844",
                        "outline-variant": "#c1c8c2",
                        "primary": "#012d1d",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#274e3d",
                        "surface-container-high": "#e4e9e7",
                        "secondary": "#0e6c4a",
                        "secondary-fixed-dim": "#85d7ad",
                        "inverse-on-surface": "#ecf2f0",
                        "inverse-primary": "#a5d0b9",
                        "tertiary": "#242623",
                        "secondary-container": "#a0f4c8",
                        "on-tertiary-fixed-variant": "#454744",
                        "surface-container-low": "#eff5f3",
                        "outline": "#717973",
                        "surface-variant": "#dee4e2",
                        "surface-bright": "#f5fbf9",
                        "secondary-fixed": "#a0f4c8",
                        "surface": "#f5fbf9",
                        "on-surface": "#171d1c",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "on-background": "#171d1c",
                        "surface-container": "#e9efed",
                        "surface-tint": "#3f6653",
                        "tertiary-container": "#3a3c39",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#c6c7c2",
                        "surface-dim": "#d5dbd9",
                        "background": "#f5fbf9",
                        "on-secondary-fixed": "#002113",
                        "tertiary-fixed": "#e2e3de",
                        "on-tertiary-container": "#a5a6a2",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#dee4e2",
                        "on-primary-container": "#86af99",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#2c3231",
                        "on-secondary-fixed-variant": "#005236",
                        "primary-fixed-dim": "#a5d0b9",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#c1ecd4",
                        "on-secondary-container": "#19724f",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#002114",
                        "on-tertiary-fixed": "#1a1c19"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "1.25rem",
                        "stack-md": "1rem",
                        "stack-sm": "0.5rem",
                        "stack-lg": "1.5rem",
                        "gutter-mobile": "1rem"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "30px", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom Input Styles to match soft minimalism */
        input[type="number"], 
        input[type="text"], 
        input[type="date"], 
        select, 
        textarea {
            background-color: var(--tw-colors-surface-container-low);
            border: 1px solid var(--tw-colors-surface-variant);
            transition: all 0.2s ease-in-out;
        }
        
        input:focus, 
        select:focus, 
        textarea:focus {
            border-color: var(--tw-colors-primary-fixed-dim);
            background-color: var(--tw-colors-surface-container-lowest);
            box-shadow: 0 4px 12px rgba(1, 45, 29, 0.05); /* Very subtle primary shadow */
            outline: none;
            ring: 0;
        }

        /* Ambient shadow for buttons */
        .ambient-shadow {
            box-shadow: 0 4px 12px rgba(27, 67, 50, 0.1);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pt-12 pb-16 antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim flex justify-between items-center px-margin-mobile h-12 border-b border-outline-variant dark:border-outline">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">account_balance</span>
<h1 class="font-headline-md text-headline-md-mobile md:text-headline-md text-primary dark:text-primary-fixed-dim">Center Tracker</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile py-stack-lg max-w-2xl mx-auto w-full">
<div class="mb-stack-lg">
<h2 class="font-headline-lg-mobile md:text-headline-lg text-on-surface">New Entry</h2>
<p class="font-body-md text-on-surface-variant mt-stack-sm">Record attendance and collections for today's session.</p>
</div>
<form class="space-y-stack-md">
<!-- Bento-style Form Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Center Selection -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface mb-2" for="center">Center Location</label>
<div class="relative">
<select class="block w-full rounded-lg font-body-lg text-body-lg text-on-surface py-3 pl-4 pr-10 appearance-none focus:ring-0" id="center" name="center">
<option value="downtown">Downtown Center</option>
<option value="northside">North Side Branch</option>
<option value="westend">West End Annex</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Date Picker -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4">
<label class="block font-label-md text-label-md text-on-surface mb-2" for="entry_date">Session Date</label>
<input class="block w-full rounded-lg font-body-lg text-body-lg text-on-surface py-3 px-4 focus:ring-0" id="entry_date" name="entry_date" type="date" value="2023-10-27"/>
</div>
<!-- Students Attended -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4">
<label class="block font-label-md text-label-md text-on-surface mb-2" for="students">Students Attended</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">groups</span>
</div>
<input class="block w-full rounded-lg font-body-lg text-body-lg text-on-surface py-3 pl-10 pr-4 text-right focus:ring-0" id="students" min="0" name="students" placeholder="0" type="number"/>
</div>
</div>
<!-- Amount Collected -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface mb-2" for="amount">Amount Collected (EGP)</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="font-label-md text-outline">EGP</span>
</div>
<input class="block w-full rounded-lg font-headline-md text-headline-md-mobile md:text-headline-md text-on-surface py-4 pl-12 pr-4 text-right focus:ring-0 bg-surface-bright" id="amount" min="0" name="amount" placeholder="0.00" step="0.01" type="number"/>
</div>
</div>
<!-- Assistants Present -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface mb-3">Assistants Present</label>
<div class="space-y-3">
<label class="flex items-center p-3 rounded-lg border border-surface-variant bg-surface hover:bg-surface-container-low cursor-pointer transition-colors">
<input checked="" class="h-5 w-5 rounded text-primary-container focus:ring-primary-container border-outline-variant bg-surface-container-lowest" name="assistants" type="checkbox" value="sarah"/>
<span class="ml-3 font-body-lg text-body-lg text-on-surface flex-grow">Sarah J.</span>
<span class="material-symbols-outlined text-secondary-fixed-dim text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
<label class="flex items-center p-3 rounded-lg border border-surface-variant bg-surface hover:bg-surface-container-low cursor-pointer transition-colors">
<input checked="" class="h-5 w-5 rounded text-primary-container focus:ring-primary-container border-outline-variant bg-surface-container-lowest" name="assistants" type="checkbox" value="mike"/>
<span class="ml-3 font-body-lg text-body-lg text-on-surface flex-grow">Mike T.</span>
<span class="material-symbols-outlined text-secondary-fixed-dim text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
<label class="flex items-center p-3 rounded-lg border border-surface-variant bg-surface hover:bg-surface-container-low cursor-pointer transition-colors">
<input checked="" class="h-5 w-5 rounded text-primary-container focus:ring-primary-container border-outline-variant bg-surface-container-lowest" name="assistants" type="checkbox" value="lina"/>
<span class="ml-3 font-body-lg text-body-lg text-on-surface flex-grow">Lina K.</span>
<span class="material-symbols-outlined text-secondary-fixed-dim text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
</div>
</div>
<!-- Notes -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface mb-2" for="notes">Notes</label>
<textarea class="block w-full rounded-lg font-body-md text-body-md text-on-surface py-3 px-4 focus:ring-0 resize-none" id="notes" name="notes" placeholder="Add any special observations..." rows="3"></textarea>
</div>
</div>
<!-- Submit Button -->
<div class="pt-stack-md pb-stack-lg">
<button class="w-full bg-primary-container text-on-primary h-14 rounded-full font-label-md text-label-md ambient-shadow flex justify-center items-center gap-2 hover:bg-secondary transition-colors duration-200" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
                    Save entry
                </button>
</div>
</form>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-16 bg-surface dark:bg-surface-dim px-gutter-mobile border-t border-outline-variant dark:border-outline shadow-sm dark:shadow-none z-50 md:hidden">
<!-- Active Tab: New Entry -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-secondary text-on-primary-container dark:text-on-secondary rounded-full px-4 py-1 scale-95 active:scale-90 transition-transform duration-150" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_box</span>
<span class="font-label-md text-[10px] mt-1 leading-none">New Entry</span>
</a>
<!-- Inactive Tab: Records -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container-low dark:hover:bg-surface-container-high rounded-full scale-95 active:scale-90 transition-transform duration-150" href="#">
<span class="material-symbols-outlined">list_alt</span>
<span class="font-label-md text-[10px] mt-1 leading-none">Records</span>
</a>
<!-- Inactive Tab: Manage -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container-low dark:hover:bg-surface-container-high rounded-full scale-95 active:scale-90 transition-transform duration-150" href="#">
<span class="material-symbols-outlined">group</span>
<span class="font-label-md text-[10px] mt-1 leading-none">Manage</span>
</a>
</nav>
<!-- Script to set today's date as default -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('entry_date');
            if (dateInput) {
                const today = new Date().toISOString().split('T')[0];
                dateInput.value = today;
            }
        });
    </script>
</body></html>
